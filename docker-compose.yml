services:
  db:
    image: postgres:17-alpine
    container_name: tarabucket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarabucket
      POSTGRES_PASSWORD: tarabucket
      POSTGRES_DB: tarabucket
    ports:
      - "5544:5432"
    volumes:
      - tarabucket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarabucket -d tarabucket"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tarabucket_pgdata:
